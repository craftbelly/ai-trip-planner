services:
  - type: web
    name: brew-crawl-planner-backend
    env: python
    plan: free
    rootDir: .
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: ENABLE_RAG
        value: "1"
      - key: USE_HUGGINGFACE_EMBEDDINGS
        value: "1"
      - key: HUGGINGFACE_EMBED_MODEL
        value: all-MiniLM-L6-v2
      - key: HERE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: PHOENIX_COLLECTOR_ENDPOINT
        value: https://app.phoenix.arize.com
      - key: PHOENIX_API_KEY
        sync: false
      - key: ARIZE_SPACE_ID
        sync: false
      - key: ARIZE_API_KEY
        sync: false
